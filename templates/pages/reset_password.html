{{define "main"}}
<section class="member-gate shell">
  <div class="member-card">
    <p class="eyebrow">Account recovery</p>
    <h1 class="section__title">Choose a new password</h1>
    <p class="member-card__intro">Enter the 8-digit code sent to your email. Codes work once and expire after 30 minutes.</p>
    {{if .Error}}<p class="flash flash--error" role="alert">{{.Error}}</p>{{end}}
    <form class="member-form" method="post" action="/reset-password">
      <label class="field"><span class="field__label">Email address</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="field"><span class="field__label">Recovery code</span><input type="text" name="code" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="one-time-code" required></label>
      <label class="field"><span class="field__label">New password</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>Use at least 8 characters.</small></label>
      <button class="btn btn--ink btn--full" type="submit">Save new password</button>
    </form>
    <p class="member-card__foot"><a href="/forgot-password">Request another recovery code</a></p>
  </div>
</section>
{{end}}
