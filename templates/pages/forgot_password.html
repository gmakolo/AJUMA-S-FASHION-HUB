{{define "main"}}
<section class="member-gate shell">
  <div class="member-card">
    <p class="eyebrow">Account recovery</p>
    <h1 class="section__title">Forgot your password?</h1>
    <p class="member-card__intro">Enter the email address on your account and we&rsquo;ll send an 8-digit recovery code if it matches.</p>
    {{if .Error}}<p class="flash flash--error" role="alert">{{.Error}}</p>{{end}}
    {{if .Message}}<p class="flash flash--ok" role="status">{{.Message}}</p>{{end}}
    <form class="member-form" method="post" action="/forgot-password">
      <label class="field"><span class="field__label">Email address</span><input type="email" name="email" autocomplete="email" required></label>
      <button class="btn btn--ink btn--full" type="submit">Send recovery code</button>
    </form>
    <p class="member-card__foot"><a href="/reset-password">I have a recovery code</a></p>
    <p class="member-card__foot"><a href="/login">Back to sign in</a></p>
  </div>
</section>
{{end}}
