<!DOCTYPE html>
<html>
<head>
    <title>Order {{ dress_name }}</title>
</head>
<body>

    <h1>Order: {{ dress_name }}</h1>

    <form method="POST">
        <label>Your Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Phone Number:</label><br>
        <input type="text" name="phone" required><br><br>
        <label>Address:</label><br>
        <input type="text" name="address" required><br><br>

        <label>Measurements:</label><br>
        <input type="text" name="measurements" placeholder="Bust, Waist, Hip"><br><br>

        <label>Description:</label><br>
        <textarea name="description" placeholder="Describe your style"></textarea><br><br>

        <button type="submit">Submit Order</button>
    </form>

</body>
</html>
